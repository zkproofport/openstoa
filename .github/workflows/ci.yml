# OpenStoa — CI
#
# Four jobs:
#   packages   — matrix over the five publishable @masselabs/* packages:
#                install -> typecheck -> unit tests.
#   server     — the root Next.js app: the SI-1 plaintext-absence gate (source
#                guard + a real row-count query against the postgres service),
#                unit tests (against a real redis:7 service container), and
#                `next build`.
#   mini-app   — packages/mobile, the OpenStoa mini-app that ships inside the
#                ZKProofport host app: install -> typecheck.
#   mcp-smoke  — boots the built `openstoa-mcp` stdio binary and asserts it
#                answers a real MCP `initialize` + `tools/list` handshake.
#
# The repo-level e2e suites (`src/__tests__/e2e/**`, `packages/*/src/__tests__/e2e/**`)
# are deliberately NOT run here: they require a deployed/live container plus R2,
# OAuth and wallet secrets. Run them with `npm run test:e2e:*` against staging.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Publishable @masselabs/* packages.
  #
  # These are NOT npm workspaces: each package has its own package-lock.json and
  # installs independently. Inter-package deps are plain semver (`^0.1.0`) and
  # resolve locally because each lock records the sibling as a Link node
  # ("resolved": "../sdk", "link": true) — `npm ci` recreates the symlink from a
  # clean checkout without ever contacting the registry.
  #
  # Because the symlink points at the sibling *source* folder, the sibling's
  # `dist/` must exist before typecheck/tests run (package.json `types`/`exports`
  # point into dist, and dist is gitignored). Hence `local-deps`: build the
  # dependency chain first, in order.
  # ---------------------------------------------------------------------------
  packages:
    name: package (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `mls` holds the ONE copy of the MLS/TAK crypto; sdk re-exports it
          # through `../mls/src/*`. It is not built, but its node_modules must
          # exist or tsc resolves nothing from it — six jobs failed on
          # "Cannot find module 'ts-mls'" until it was listed here. Locally it
          # passed only because the repo-root node_modules happened to satisfy
          # the lookup, which is why a green local run proved nothing.
          - package: sdk
            local-deps: 'mls'
          - package: commands
            local-deps: 'mls sdk'
          - package: cli
            local-deps: 'mls sdk commands'
          - package: mcp
            local-deps: 'mls sdk commands'
          - package: channel
            local-deps: 'mls sdk commands'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build local dependencies (in order)
        shell: bash
        run: |
          for dep in ${{ matrix.local-deps }}; do
            echo "::group::packages/$dep"
            # `mls` is consumed as SOURCE (sdk re-exports ../mls/src/*), so it
            # has no build script and nothing to emit — it only needs its own
            # node_modules present for tsc to resolve ts-mls. Everything else
            # is consumed through dist/ and must be built.
            if [ -f "packages/$dep/package-lock.json" ]; then
              ( cd "packages/$dep" && npm ci --no-audit --no-fund )
            else
              ( cd "packages/$dep" && npm install --no-audit --no-fund )
            fi
            if node -e "process.exit(require('./packages/$dep/package.json').scripts?.build ? 0 : 1)"; then
              ( cd "packages/$dep" && npm run build )
            fi
            echo "::endgroup::"
          done

      - name: Install
        working-directory: packages/${{ matrix.package }}
        run: npm ci --no-audit --no-fund

      - name: Type check
        working-directory: packages/${{ matrix.package }}
        run: npx tsc --noEmit

      - name: Test
        working-directory: packages/${{ matrix.package }}
        run: npm test

      - name: Build
        working-directory: packages/${{ matrix.package }}
        run: npm run build

  # ---------------------------------------------------------------------------
  # Root Next.js server.
  # ---------------------------------------------------------------------------
  server:
    name: server (next build + unit tests)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Five suites (mls-archive, mls-commit-cas, mls-key-packages.concurrency,
      # push, push-ciphertext) are integration tests: they open their own pg Pool
      # and exercise real SQL (CAS commits, holder leases, cursor windows). They
      # default to `postgresql://proofport:proofport@localhost:5432/openstoa`, so
      # this service must match those credentials — locally they hit the compose
      # Postgres, which is why they pass there and needed a DB here too.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: proofport
          POSTGRES_PASSWORD: proofport
          POSTGRES_DB: openstoa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proofport"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Both point at the service containers above. Nothing else is injected:
      # `next build` and the unit suite run with no other env set (no
      # COMMUNITY_JWT_SECRET, no R2 credentials). Any code path that genuinely
      # requires a secret must throw rather than fall back to a default — do not
      # add placeholder values here to make a job go green.
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://proofport:proofport@localhost:5432/openstoa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Apply migrations
        # Same runner the server uses at boot (src/instrumentation.ts). NOT
        # `npm run db:migrate` (drizzle-kit): against a fresh database that
        # aborts with a column-name collision and creates zero tables.
        run: npm run db:migrate:apply

      - name: SI-1 plaintext-absence gate
        # Two halves: the chat POST route still carries its plaintext-rejection
        # guard, AND no chat_messages row of type='message' has a non-NULL
        # plaintext system_text. `--strict` makes an unset/unreachable
        # DATABASE_URL FATAL — without it the DB half self-skips with a warning
        # and the step goes green having verified nothing, which is worse than
        # having no gate at all. Runs after migrations so the table exists.
        run: npm run verify:no-plaintext-chat -- --strict

      - name: Unit tests
        # `packages/**` is excluded: every package has its own job with its own
        # lockfile (the five publishable ones in the matrix above, packages/mobile
        # in `mini-app` below) and, for the publishable ones, its own built dist.
        # The repo e2e suite is excluded for the reason in the file header. The
        # other three excludes restate vitest.config.ts's defaults, which a CLI
        # `--exclude` would otherwise replace.
        run: |
          npx vitest run \
            --exclude '**/node_modules/**' \
            --exclude '**/dist/**' \
            --exclude '**/.next/**' \
            --exclude '**/__tests__/e2e/**' \
            --exclude 'packages/**'

      - name: Build
        # `prebuild` regenerates public/skill.md + public/skills/** from the
        # OpenAPI JSDoc, so this also proves the skill generator still runs.
        run: npm run build

  # ---------------------------------------------------------------------------
  # OpenStoa mini-app (packages/mobile).
  #
  # The React Native app that runs inside the ZKProofport host. Nothing else in
  # this repo type-checked it, which is how it accumulated 44 tsc errors while
  # the root app sat at zero — this job is the gate that stops that recurring.
  #
  # TWO installs, and they are not interchangeable:
  #
  #   packages/mobile           — the package's OWN dependencies (react-query,
  #                               zustand, react-native-sse) plus typescript and
  #                               vitest.
  #   packages/mobile/typecheck — a TYPE-ONLY dependency root holding React
  #                               Native and the host app's UI libraries. On a
  #                               developer machine tsc resolves those from the
  #                               `proofport-app` checkout next door; that repo
  #                               is private and separate, so CI has to supply
  #                               them itself. tsconfig.json lists both
  #                               locations and takes whichever exists, so there
  #                               is no CI-only tsconfig to drift.
  #
  # `--legacy-peer-deps` on BOTH is load-bearing, for two different reasons:
  #   - packages/mobile lists react-native as a peerDependency. Letting npm
  #     auto-install it would put a second React Native inside
  #     `packages/mobile/node_modules`, which Metro finds by walking up from
  #     `src/` and prefers over the host's — two React Natives in the shipped
  #     app. The committed lockfile records the tree WITHOUT it; keep it so.
  #   - the typecheck root pulls react-native-keyboard-controller, whose
  #     reanimated peer wants a newer react-native than the host pins. It only
  #     needs the .d.ts files, so npm's peer graph is not meaningful there.
  #
  # NOT RUN HERE, and this is a known gap rather than an oversight: the
  # mini-app's 550-test vitest suite. `packages/mobile/vitest.config.ts` pins
  # react, react-test-renderer, i18next and @react-navigation/native to
  # `../../../proofport-app/node_modules` by absolute path so every module in
  # the run shares one React — with no host app that path does not exist and
  # 19 of 37 files fail to import. Pointing it at the typecheck root instead
  # gets most of the way (30/37) but not all, so making the suite host-free is
  # its own piece of work. Until then it runs on developer machines only; the
  # typecheck above is what this job actually guarantees.
  # ---------------------------------------------------------------------------
  mini-app:
    name: mini-app (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install (mini-app)
        working-directory: packages/mobile
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Install (type-only host deps)
        working-directory: packages/mobile/typecheck
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Type check
        working-directory: packages/mobile
        run: npm run typecheck

      # -----------------------------------------------------------------------
      # THE MINI-APP'S OWN TESTS. This job type-checked and stopped, so 1,354
      # cases across 100 files never ran in CI — including every guard written
      # for the recovery code, the device erase and the backup retry, all of
      # which live here rather than in the server tree.
      #
      # A type check cannot see any of what those guard: a warning that lies
      # about where a key is kept, an erase that reports success while keys
      # remain, a retry that gives up after one attempt. All three type-check
      # perfectly.
      #
      # `vitest run` and not `npm test` — the bare script starts vitest in WATCH
      # mode, which on a runner means a job that hangs until it is cancelled and
      # reports neither pass nor fail.
      # -----------------------------------------------------------------------
      - name: Tests
        working-directory: packages/mobile
        run: npx vitest run -c vitest.config.ts --reporter=basic

  # ---------------------------------------------------------------------------
  # MCP stdio binary smoke test.
  #
  # Guards the entrypoint-guard class of bug that once shipped a CLI bin which
  # exited 0 without doing anything. Type-checks and unit tests cannot catch it;
  # only running the built binary and getting a JSON-RPC answer back can.
  # ---------------------------------------------------------------------------
  mcp-smoke:
    name: mcp stdio smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build mls -> sdk -> commands -> mcp
        shell: bash
        run: |
          # `mls` leads the list because sdk compiles `../mls/src/*` directly.
          # Its node_modules must exist or tsc resolves `ts-mls` to nothing and
          # the dts build dies. It has no build script of its own, hence the
          # guard — the matrix job above carries the same shape for the same
          # reason.
          for pkg in mls sdk commands mcp; do
            echo "::group::packages/$pkg"
            (
              cd "packages/$pkg"
              npm ci --no-audit --no-fund
              npm run build --if-present
            )
            echo "::endgroup::"
          done

      - name: Boot openstoa-mcp and complete an MCP handshake
        run: node scripts/mcp-smoke.mjs
